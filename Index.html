<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTA District Kashmore - Digital Membership App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 text-center">
        <h1 class="text-2xl font-bold">يٿا ضلع ڪشمور (YTA District Kashmore)</h1>
        <p class="text-sm mt-1 text-emerald-100">ڊجيٽل ممبرشمپ ۽ رجسٽريشن سسٽم</p>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-8 max-w-xl flex-grow">
        
        <!-- Registration Form Card -->
        <div id="form-card" class="bg-white rounded-xl shadow-lg p-6 mb-6 border border-slate-100">
            <h2 class="text-xl font-semibold mb-4 text-emerald-800 border-b pb-2">نئون ممبر فارم</h2>
            
            <form id="membershipForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">پورو نالو (Full Name)</label>
                    <input type="text" id="fullName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">والد جو نالو (Father's Name)</label>
                    <input type="text" id="fatherName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">فون نمبر (Phone Number)</label>
                    <input type="tel" id="phoneNumber" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">علاقو / ٽائون (Area / Town)</label>
                    <input type="text" id="area" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow">
                    رجسٽر ڪريو
                </button>
            </form>
            <div id="formMsg" class="mt-4 text-center text-sm font-medium"></div>
        </div>

        <!-- Admin Login Link / Section -->
        <div class="text-center">
            <button onclick="toggleAdminPanel()" class="text-xs text-emerald-700 hover:underline font-medium">
                انتظاميہ لاگ ان (Admin Panel)
            </button>
        </div>

        <!-- Admin Dashboard (Hidden by default) -->
        <div id="adminPanel" class="hidden mt-6 bg-white rounded-xl shadow-lg p-6 border border-slate-100">
            <h3 class="text-lg font-semibold mb-4 text-slate-800 border-b pb-2">ايڊمن ڊيش بورڊ</h3>
            <div id="adminLoginBox">
                <input type="password" id="adminPass" placeholder="ايڊمن پاسورڊ داخل ڪريو" class="w-full px-3 py-2 border border-slate-300 rounded-lg mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="checkAdminLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium py-2 rounded-lg transition duration-200">
                    لاگ ان ٿيو
                </button>
                <p id="loginError" class="text-red-500 text-xs mt-2 text-center"></p>
            </div>

            <div id="adminContent" class="hidden">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold text-emerald-700">سڀ رجسٽرڊ ممبر</span>
                    <button onclick="loadMembers()" class="text-xs bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded text-slate-700">ريفرش ڪريو</button>
                </div>
                <div class="overflow-x-auto max-h-60 border rounded-lg">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-100 text-slate-700 border-b">
                            <tr>
                                <th class="p-2">نالو</th>
                                <th class="p-2">والد جو نالو</th>
                                <th class="p-2">فون نمبر</th>
                                <th class="p-2">علاقو</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody" class="divide-y divide-slate-100">
                            <!-- Data will load here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 text-center py-4 text-xs">
        <p>&copy; 2026 YTA District Kashmore. All rights reserved.</p>
    </footer>

    <!-- Supabase Integration & Logic Script -->
    <script>
        // Supabase Configuration
        const SUPABASE_URL = "https://mkrbxzlkzjgcswhvfhmx.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_ZtcYI-EkbOvP1DKbmZDILA_vTmEBeLf";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Form Submission Logic
        const form = document.getElementById('membershipForm');
        const submitBtn = document.getElementById('submitBtn');
        const formMsg = document.getElementById('formMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "جمع ٿي رهيو آهي...";
            formMsg.textContent = "";

            const fullName = document.getElementById('fullName').value;
            const fatherName = document.getElementById('fatherName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const area = document.getElementById('area').value;

            try {
                const { data, error } = await _supabase
                    .from('members') // Apni Supabase table ka naam yahan 'members' hona chahiye
                    .insert([{ full_name: fullName, father_name: fatherName, phone_number: phoneNumber, area: area }]);

                if (error) throw error;

                formMsg.textContent = "مبارڪ ہو! اوھان جو فارم ڪاميابيءَ سان جمع ٿي ويو آهي.";
                formMsg.className = "mt-4 text-center text-sm font-medium text-emerald-600";
                form.reset();
            } catch (err) {
                formMsg.textContent = "خرابي پيش آئي: " + err.message;
                formMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "رجسٽر ڪريو";
            }
        });

        // Admin Panel Toggle & Auth
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        function checkAdminLogin() {
            const pass = document.getElementById('adminPass').value;
            // Aap apna admin password yahan change kar sakte hain (filhal 'admin123' rakha hai)
            if (pass === 'admin123') {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                loadMembers();
            } else {
                document.getElementById('loginError').textContent = "गलत پاسورڊ!";
            }
        }

        // Load Members from Supabase
        async function loadMembers() {
            const tbody = document.getElementById('membersTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-500">لوڊ ٿي رهيو آهي...</td></tr>`;

            try {
                const { data, error } = await _supabase
                    .from('members')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-500">ڪو به رڪارڊ موجود ناهي.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(m => {
                    const row = `<tr>
                        <td class="p-2">${m.full_name || ''}</td>
                        <td class="p-2">${m.father_name || ''}</td>
                        <td class="p-2">${m.phone_number || ''}</td>
                        <td class="p-2">${m.area || ''}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-red-500">ڊيٽا φلوڊ ڪرڻ ۾ غلطي ٿي.</td></tr>`;
            }
        }
    </script>
</body>
</html>
